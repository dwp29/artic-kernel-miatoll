name: build-artic-variants

on:
  push:
    branches: [main]
    paths:
      - scripts/**
      - config/**
      - versions.lock
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artic-variants
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [artic, artic-xp]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex ccache libssl-dev libelf-dev zlib1g-dev xz-utils cpio build-essential wget zip unzip python3 git

      - name: Fetch pinned source
        run: bash scripts/fetch-sources.sh

      - name: Verify source revision and layout
        run: bash scripts/verify-source.sh

      - name: Build ${{ matrix.variant }}
        run: bash scripts/build-variant.sh

      - name: Upload ${{ matrix.variant }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artic-${{ matrix.variant }}
          if-no-files-found: warn
          path: |
            src/out/arch/arm64/boot/Image.gz
            src/out/arch/arm64/boot/dtbo.img
            src/out/arch/arm64/boot/dts/qcom/cust-atoll-ab.dtb
            src/out/include/generated/compile.h
            src/AnyKernel3/artic-*.zip
            src/log.txt
